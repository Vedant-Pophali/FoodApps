# ===============================
# Application Configuration
# ===============================
spring.application.name=FoodApp

# ===============================
# MongoDB Configuration
# ===============================
# MongoDB URI is injected via the MONGO_URL environment variable
spring.data.mongodb.uri=${MONGO_URL}

# ===============================
# AWS Configuration
# ===============================
# AWS Access Key and Secret are injected via environment variables
aws.access.key=${AWS_ACCESS_KEY}
aws.secret.key=${AWS_SECRET_KEY}
aws.region=ap-south-1
aws.s3.bucketname=foood-foodiess

# ===============================
# JWT Configuration
# ===============================
# Secret key used for signing JWT tokens
jwt.secret.key=${JWT_SECRET_KEY}

# ===============================
# Razorpay Payment Gateway Configuration
# ===============================
razorpay_key=${RAZORPAY_KEY}
razorpay_secret=${RAZORPAY_SECRET_KEY}

# ===============================
# Logging Configuration
# ===============================
# Enable DEBUG logs for Spring Security and Web layer
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# ===============================
# Server Configuration
# ===============================
# Server port and host address; PORT is optional and will fallback to 8080
server.port=${PORT:8080}
server.address=0.0.0.0